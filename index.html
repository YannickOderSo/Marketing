<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebranding-Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brandmark" href="#start" aria-label="Zur Startseite">
      <img class="logo" id="logo" alt="" hidden>
      <span class="wordmark" id="wordmark"><strong id="wm-name">Hochschule Kaiserslautern</strong><span id="wm-sub">University of Applied Sciences</span></span>
    </a>
    <div class="course">
      <span class="course-title" id="course-title">Strategisches Marketing</span>
      <span class="course-meta" id="course-meta"></span>
    </div>
    <nav class="site-nav" aria-label="Bereiche">
      <a href="#start" data-nav="start">Start</a>
      <a href="#auslosung" data-nav="auslosung">Auslosung</a>
      <a href="#start" data-nav="gruppe" id="nav-group" hidden>Arbeitsbereich</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="modal-head">
    <h2 id="modal-title">QR-Code</h2>
    <button type="button" class="icon-btn" id="modal-close" aria-label="Schließen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="wrap">Bitte JavaScript aktivieren, damit die Seite funktioniert.</p></noscript>

<script src="vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
